[package]
name = "see"
version = "0.1.0"
description = "A lightweight cross-platform image viewer"
authors = ["OpenAI"]
edition = "2021"

[lib]
name = "see_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
base64 = "0.22.1"
dirs = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = ["protocol-asset"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52.0"
